name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector ships an image with the vector extension already built.
        # The base postgres:16 image would require us to compile it at
        # CI runtime; this avoids that and matches what prod runs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: picur
          POSTGRES_PASSWORD: picur
          POSTGRES_DB: picur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U picur"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: picur
      POSTGRES_PASSWORD: picur
      POSTGRES_TEST_DB: picur_test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # conftest reads POSTGRES_* / REDIS_* for the test connection,
      # but the APPLICATION code reads DATABASE_URL and REDIS_URL
      # (pydantic Settings). Without overriding those, the app's
      # module-level redis client tries to connect to 'redis:6379'
      # — the docker service hostname — and CI fails with name
      # resolution errors on every test that touches the rate
      # limiter or background queue.
      DATABASE_URL: postgresql://picur:picur@localhost:5432/picur_test
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://picur:picur@localhost:5432/picur_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=picur psql -h localhost -U picur -d picur_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Run pytest (non-hypothesis suite)
        working-directory: backend
        # Skip the hypothesis property suites — they're slow and run
        # separately on a nightly cron if/when we add one.
        # Also skip tests that need a real MinIO / CompreFace; CI only
        # spins up Postgres + Redis as service containers.
        run: |
          pytest -q \
            -m "not requires_external_services" \
            --ignore=tests/test_face_matching_properties.py \
            --ignore=tests/test_face_indexing_properties.py

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: npm audit (production deps)
        working-directory: frontend
        # Gate on new high+ vulnerabilities in production deps.
        # Currently-accepted advisories are allowlisted in
        # audit-ci.json and documented in SECURITY_AUDIT.md; a
        # NEW vulnerable package in `--omit=dev` will fail this.
        run: npx audit-ci --config audit-ci.json

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        # tsc --noEmit catches type drift before the Next build does;
        # cheaper to run and reports more granular errors.
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          BUILD_ENV: production
