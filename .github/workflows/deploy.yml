name: Deploy to Production

on:
  workflow_run:
    # Only deploy after the Test workflow on main succeeds. A broken
    # migration, failed pytest, or failed frontend build now blocks the
    # deploy instead of silently shipping a regression.
    workflows: ["Test"]
    types: [completed]
    branches: [main]

# Cancel an in-flight deploy when a new push lands on main, so a fast follow-up
# commit doesn't queue behind the previous build.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    # Skip if the upstream Test workflow did not complete successfully
    # (failures, cancellations, etc).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/ahgir
            git fetch origin main
            git checkout main
            # `git reset --hard` instead of `git pull --ff-only` so the
            # deploy never fails because the VPS working tree drifted
            # (manual ssh ops mid-deploy, a docker container that wrote
            # to a mounted file, etc.). The deploy rebuilds images from
            # scratch anyway, so the working tree is throwaway between
            # runs — nothing of value lives in it that isn't in git.
            git reset --hard origin/main

            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.vps.yml --env-file .env.production"

            # Build new images FIRST so the new migration files (and any new
            # alembic revision IDs) are present in the image we use to run
            # alembic upgrade head. Running migration against the prior image
            # would silently no-op on this revision and only apply on the NEXT
            # deploy, masking schema drift.
            docker compose $COMPOSE_FILES build backend worker frontend

            # Apply any pending alembic migrations against the running DB
            # using the freshly built backend image.
            docker compose $COMPOSE_FILES run --rm --no-deps backend sh -c 'cd /app && alembic upgrade head'

            # Recreate services. Data services (postgres, minio, redis,
            # compreface-*) intentionally NOT restarted — they're stateful
            # and don't change between deploys.
            #
            # Frontend is intentionally split into two passes for rolling
            # zero-downtime: recreate `frontend` first while `frontend-2`
            # continues serving the previous build on port 3002, then
            # recreate `frontend-2` once `frontend` is back. Doing them in
            # one shot used to mean BOTH replicas restart together, and
            # in some past deploys only `frontend` was listed at all —
            # which left `frontend-2` permanently pinned to a stale
            # image until someone noticed customers seeing old code (the
            # "RM 9 / RM 39 still shows in superadmin" incident on
            # 2026-05-14). Both must be force-recreated every deploy.
            #
            # worker-2/3/4 share the `ahgir-worker` image built above — they
            # MUST be listed explicitly here, otherwise they stay pinned to
            # the previous image (same class of bug as the frontend-2 incident).
            docker compose $COMPOSE_FILES up -d --force-recreate backend worker worker-2 worker-3 worker-4 frontend retention-scheduler

            # Wait for `frontend` to be reachable on its loopback port
            # before flipping `frontend-2` — otherwise both replicas
            # could be mid-restart at the same instant.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:3001; then break; fi
              sleep 1
            done

            docker compose $COMPOSE_FILES up -d --force-recreate frontend-2

            # Reclaim disk
            docker image prune -f

            # Smoke check
            sleep 5
            curl -fsS https://picur.my/api/health > /dev/null
