name: Deploy to Production

on:
  push:
    branches: [main]

# Cancel an in-flight deploy when a new push lands on main, so a fast follow-up
# commit doesn't queue behind the previous build.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/ahgir
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.vps.yml --env-file .env.production"

            # Apply any pending alembic migrations against the running DB before
            # rebuilding services. Uses the existing backend image so it works
            # even on the very first deploy of a migration.
            docker compose $COMPOSE_FILES run --rm --no-deps backend sh -c 'cd /app && alembic upgrade head'

            # Build new images
            docker compose $COMPOSE_FILES build backend worker frontend

            # Recreate services with new images. Data services (postgres, minio,
            # redis, compreface-*) intentionally NOT restarted — they're stateful
            # and don't change between deploys.
            docker compose $COMPOSE_FILES up -d --force-recreate backend worker frontend retention-scheduler

            # Reclaim disk
            docker image prune -f

            # Smoke check
            sleep 5
            curl -fsS https://picur.my/api/health > /dev/null
