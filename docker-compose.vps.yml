# VPS overlay: production topology when an external nginx terminates TLS and
# load-balances the two frontend instances. Pairs with docker-compose.yml.
#
# Differences vs docker-compose.prod.yml:
#   - Two Next.js frontend instances (frontend + frontend-2) for rolling deploys
#   - Caddy disabled (the host's nginx handles TLS + routing)
#   - All published ports bound to 127.0.0.1 only (nginx is the only ingress)
#   - CompreFace admin/UI exposed on a loopback port for ops access
#   - restart: unless-stopped on every long-running service
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# scripts/deploy-vps.sh assumes this layout.
services:
  postgres:
    # Bind to VPS loopback only — NOT internet-exposed. Only processes
    # on the VPS host (i.e., something running through SSH) can reach
    # this port. Required so ops can SSH-tunnel and connect via local
    # tools (HeidiSQL, pgAdmin, psql) for inspection / debugging.
    #
    # Host port 5433 (NOT 5432): the VPS has a system postgres of its
    # own listening on 127.0.0.1:5432, so the docker postgres steals
    # the next loopback port instead of fighting it. The SSH-tunnel
    # command on the docs side uses 5433 too.
    #
    # If you ever change this to "5433:5432" without the 127.0.0.1
    # prefix you expose the DB to the public internet — don't.
    ports: !override
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped
    environment:
      # Inherit credentials from base compose; ADD a KMS master key for
      # SSE-S3 server-side encryption. Format: <name>:<base64-32-byte-key>.
      # The key MUST stay stable across restarts — losing it makes every
      # encrypted object unreadable. The value lives in .env.production
      # on the VPS only (never committed); back it up in a password
      # manager. Without this env, app put_object calls with sse=SseS3()
      # would 400. With it, MinIO encrypts each new object on write.
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY}"

  redis:
    ports: !reset []
    restart: unless-stopped

  backend:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
    ports: !override
      - "127.0.0.1:8005:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=172.18.0.1,127.0.0.1
    restart: unless-stopped

  worker:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
      PYTHONPATH: /app
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  retention-scheduler:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
    command: >
      /bin/sh -c "sleep 60;
      while true; do
        if PYTHONPATH=/app python scripts/preflight.py && PYTHONPATH=/app python scripts/run_retention.py; then
          sleep 86400;
        else
          echo 'retention preflight or enqueue failed (exit non-zero); retrying in 1h';
          sleep 3600;
        fi;
      done"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
        NEXT_PUBLIC_API_URL: /api
        # Turnstile site key — public, baked into the JS at build time so
        # ReportPhotoModal can render the widget. Empty in dev (the widget
        # is then skipped + the backend also skips token verification).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      SERVER_API_URL: http://backend:8000
    volumes: !reset []
    ports: !override
      - "127.0.0.1:3001:3000"
    command: ["npm", "start"]
    restart: unless-stopped

  # Second frontend instance for rolling-deploy zero-downtime.
  # Identical build to `frontend`; nginx upstream group fronts both on 127.0.0.1:3001,3002.
  frontend-2:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: ahgir-frontend
    container_name: picur-frontend-2
    environment:
      NEXT_PUBLIC_API_URL: /api
      SERVER_API_URL: http://backend:8000
    command: ["npm", "start"]
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

  compreface-admin:
    ports: !override
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  compreface-api:
    ports: !reset []
    environment:
      API_JAVA_OPTS: "-Xmx2g"
    restart: unless-stopped

  compreface-core:
    restart: unless-stopped

  compreface-postgres-db:
    restart: unless-stopped

  # Caddy is disabled in VPS mode — the host's nginx terminates TLS instead.
  caddy:
    deploy:
      replicas: 0

  # CompreFace UI bundle (missing from base compose). FE = React app, ui-nginx
  # routes /api/* -> api backend, /admin/* -> admin backend, /* -> fe.
  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: compreface-fe
    environment:
      CLIENT_MAX_BODY_SIZE: 50M
      PROXY_READ_TIMEOUT: 60s
      PROXY_CONNECT_TIMEOUT: 60s
      MAX_FILE_SIZE: 5242880
    depends_on:
      - compreface-admin
      - compreface-api
    restart: unless-stopped

  compreface-ui-nginx:
    image: nginx:1.25-alpine
    container_name: compreface-ui-nginx
    depends_on:
      - compreface-fe
      - compreface-admin
      - compreface-api
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./compreface-ui-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
