# VPS overlay: production topology when an external nginx terminates TLS and
# load-balances the two frontend instances. Pairs with docker-compose.yml.
#
# Differences vs docker-compose.prod.yml:
#   - Two Next.js frontend instances (frontend + frontend-2) for rolling deploys
#   - Caddy disabled (the host's nginx handles TLS + routing)
#   - All published ports bound to 127.0.0.1 only (nginx is the only ingress)
#   - CompreFace admin/UI exposed on a loopback port for ops access
#   - restart: unless-stopped on every long-running service
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# scripts/deploy-vps.sh assumes this layout.
services:
  postgres:
    # Bind to VPS loopback only — NOT internet-exposed. Only processes
    # on the VPS host (i.e., something running through SSH) can reach
    # this port. Required so ops can SSH-tunnel and connect via local
    # tools (HeidiSQL, pgAdmin, psql) for inspection / debugging.
    #
    # Host port 5433 (NOT 5432): the VPS has a system postgres of its
    # own listening on 127.0.0.1:5432, so the docker postgres steals
    # the next loopback port instead of fighting it. The SSH-tunnel
    # command on the docs side uses 5433 too.
    #
    # If you ever change this to "5433:5432" without the 127.0.0.1
    # prefix you expose the DB to the public internet — don't.
    ports: !override
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped
    environment:
      # Inherit credentials from base compose; ADD a KMS master key for
      # SSE-S3 server-side encryption. Format: <name>:<base64-32-byte-key>.
      # The key MUST stay stable across restarts — losing it makes every
      # encrypted object unreadable. The value lives in .env.production
      # on the VPS only (never committed); back it up in a password
      # manager. Without this env, app put_object calls with sse=SseS3()
      # would 400. With it, MinIO encrypts each new object on write.
      MINIO_KMS_SECRET_KEY: "${MINIO_KMS_SECRET_KEY}"

  redis:
    ports: !reset []
    restart: unless-stopped

  backend:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
    ports: !override
      - "127.0.0.1:8005:8000"
    # Bumped --workers 4 → 8 to lift the sustained scan rate from
    # ~6 → ~12 scans/sec. Each worker is ~200MB, so 8 × 200MB = 1.6GB —
    # well within the VPS RAM budget. Tune lower if memory pressure
    # ever rises.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 8 --proxy-headers --forwarded-allow-ips=172.18.0.1,127.0.0.1
    restart: unless-stopped

  # Four parallel RQ workers. Without this a 1000-photo upload takes
  # ~3.3h to index on one worker; 4 workers cuts that to ~50min. They
  # all subscribe to the same Redis queues (face_indexing / retention
  # / default), so RQ load-balances jobs across them automatically.
  #
  # The codebase prefers explicit per-instance services over
  # `deploy: replicas:` (which only works in swarm mode) — same
  # pattern as `frontend-2`.
  worker:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
      PYTHONPATH: /app
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  worker-2:
    image: ahgir-worker
    container_name: picur-worker-2
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      COMPREFACE_DETECTION_API_KEY: ${COMPREFACE_DETECTION_API_KEY:-}
      COMPREFACE_DB_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.80}
      FACE_SIMILARITY_THRESHOLD_MEDIUM: ${FACE_SIMILARITY_THRESHOLD_MEDIUM:-0.85}
      FACE_SIMILARITY_THRESHOLD_SMALL: ${FACE_SIMILARITY_THRESHOLD_SMALL:-0.90}
      FACE_SIZE_MEDIUM_PX: ${FACE_SIZE_MEDIUM_PX:-60}
      FACE_SIZE_LARGE_PX: ${FACE_SIZE_LARGE_PX:-150}
      FACE_MIN_DETECTION_PROBABILITY: ${FACE_MIN_DETECTION_PROBABILITY:-0.4}
      FACE_MIN_CROP_PIXELS: ${FACE_MIN_CROP_PIXELS:-32}
      FACE_CROP_PADDING_FACTOR: ${FACE_CROP_PADDING_FACTOR:-0.4}
      FACE_GENDER_FILTER_ENABLED: ${FACE_GENDER_FILTER_ENABLED:-false}
      # Re-ID body matching. Indexing/backfill default ON; the scan-time gate
      # defaults OFF (shadow mode). Phase 3 = set REID_ENABLED_SCAN=true in
      # .env.production once shadow data confirms separation, then restart.
      # reid-api URL uses the config default (http://reid-api:5000).
      REID_ENABLED_INDEXING: ${REID_ENABLED_INDEXING:-true}
      REID_ENABLED_SCAN: ${REID_ENABLED_SCAN:-false}
      REID_SIMILARITY_THRESHOLD: ${REID_SIMILARITY_THRESHOLD:-0.65}
      REID_FACE_MIN_FOR_GATE: ${REID_FACE_MIN_FOR_GATE:-0.90}
      REID_ADAPTIVE_MARGIN: ${REID_ADAPTIVE_MARGIN:-0.18}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-for-prod}
      ENVIRONMENT: production
      PYTHONPATH: /app
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
      reid-api:
        # service_started — Re-ID is fail-soft. A missing OSNet model must
        # not block the indexer or backend; missing embeddings are written
        # as NULL and the scan-time gate falls back to face-only.
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  worker-3:
    image: ahgir-worker
    container_name: picur-worker-3
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      COMPREFACE_DETECTION_API_KEY: ${COMPREFACE_DETECTION_API_KEY:-}
      COMPREFACE_DB_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.80}
      FACE_SIMILARITY_THRESHOLD_MEDIUM: ${FACE_SIMILARITY_THRESHOLD_MEDIUM:-0.85}
      FACE_SIMILARITY_THRESHOLD_SMALL: ${FACE_SIMILARITY_THRESHOLD_SMALL:-0.90}
      FACE_SIZE_MEDIUM_PX: ${FACE_SIZE_MEDIUM_PX:-60}
      FACE_SIZE_LARGE_PX: ${FACE_SIZE_LARGE_PX:-150}
      FACE_MIN_DETECTION_PROBABILITY: ${FACE_MIN_DETECTION_PROBABILITY:-0.4}
      FACE_MIN_CROP_PIXELS: ${FACE_MIN_CROP_PIXELS:-32}
      FACE_CROP_PADDING_FACTOR: ${FACE_CROP_PADDING_FACTOR:-0.4}
      FACE_GENDER_FILTER_ENABLED: ${FACE_GENDER_FILTER_ENABLED:-false}
      # Re-ID body matching. Indexing/backfill default ON; the scan-time gate
      # defaults OFF (shadow mode). Phase 3 = set REID_ENABLED_SCAN=true in
      # .env.production once shadow data confirms separation, then restart.
      # reid-api URL uses the config default (http://reid-api:5000).
      REID_ENABLED_INDEXING: ${REID_ENABLED_INDEXING:-true}
      REID_ENABLED_SCAN: ${REID_ENABLED_SCAN:-false}
      REID_SIMILARITY_THRESHOLD: ${REID_SIMILARITY_THRESHOLD:-0.65}
      REID_FACE_MIN_FOR_GATE: ${REID_FACE_MIN_FOR_GATE:-0.90}
      REID_ADAPTIVE_MARGIN: ${REID_ADAPTIVE_MARGIN:-0.18}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-for-prod}
      ENVIRONMENT: production
      PYTHONPATH: /app
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
      reid-api:
        # service_started — Re-ID is fail-soft. A missing OSNet model must
        # not block the indexer or backend; missing embeddings are written
        # as NULL and the scan-time gate falls back to face-only.
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  worker-4:
    image: ahgir-worker
    container_name: picur-worker-4
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-}
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      COMPREFACE_DETECTION_API_KEY: ${COMPREFACE_DETECTION_API_KEY:-}
      COMPREFACE_DB_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.80}
      FACE_SIMILARITY_THRESHOLD_MEDIUM: ${FACE_SIMILARITY_THRESHOLD_MEDIUM:-0.85}
      FACE_SIMILARITY_THRESHOLD_SMALL: ${FACE_SIMILARITY_THRESHOLD_SMALL:-0.90}
      FACE_SIZE_MEDIUM_PX: ${FACE_SIZE_MEDIUM_PX:-60}
      FACE_SIZE_LARGE_PX: ${FACE_SIZE_LARGE_PX:-150}
      FACE_MIN_DETECTION_PROBABILITY: ${FACE_MIN_DETECTION_PROBABILITY:-0.4}
      FACE_MIN_CROP_PIXELS: ${FACE_MIN_CROP_PIXELS:-32}
      FACE_CROP_PADDING_FACTOR: ${FACE_CROP_PADDING_FACTOR:-0.4}
      FACE_GENDER_FILTER_ENABLED: ${FACE_GENDER_FILTER_ENABLED:-false}
      # Re-ID body matching. Indexing/backfill default ON; the scan-time gate
      # defaults OFF (shadow mode). Phase 3 = set REID_ENABLED_SCAN=true in
      # .env.production once shadow data confirms separation, then restart.
      # reid-api URL uses the config default (http://reid-api:5000).
      REID_ENABLED_INDEXING: ${REID_ENABLED_INDEXING:-true}
      REID_ENABLED_SCAN: ${REID_ENABLED_SCAN:-false}
      REID_SIMILARITY_THRESHOLD: ${REID_SIMILARITY_THRESHOLD:-0.65}
      REID_FACE_MIN_FOR_GATE: ${REID_FACE_MIN_FOR_GATE:-0.90}
      REID_ADAPTIVE_MARGIN: ${REID_ADAPTIVE_MARGIN:-0.18}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-for-prod}
      ENVIRONMENT: production
      PYTHONPATH: /app
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
      reid-api:
        # service_started — Re-ID is fail-soft. A missing OSNet model must
        # not block the indexer or backend; missing embeddings are written
        # as NULL and the scan-time gate falls back to face-only.
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  retention-scheduler:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
    command: >
      /bin/sh -c "sleep 60;
      while true; do
        if PYTHONPATH=/app python scripts/preflight.py && PYTHONPATH=/app python scripts/run_retention.py; then
          sleep 86400;
        else
          echo 'retention preflight or enqueue failed (exit non-zero); retrying in 1h';
          sleep 3600;
        fi;
      done"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
        NEXT_PUBLIC_API_URL: /api
        # Turnstile site key — public, baked into the JS at build time so
        # ReportPhotoModal can render the widget. Empty in dev (the widget
        # is then skipped + the backend also skips token verification).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # "true" reveals the "Continue with Google" button. Keep in lockstep
        # with the backend GOOGLE_CLIENT_ID/SECRET being set.
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-}
    environment:
      SERVER_API_URL: http://backend:8000
    volumes: !reset []
    ports: !override
      - "127.0.0.1:3001:3000"
    command: ["npm", "start"]
    restart: unless-stopped

  # Second frontend instance for rolling-deploy zero-downtime.
  # Identical build to `frontend`; nginx upstream group fronts both on 127.0.0.1:3001,3002.
  frontend-2:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-}
    image: ahgir-frontend
    container_name: picur-frontend-2
    environment:
      NEXT_PUBLIC_API_URL: /api
      SERVER_API_URL: http://backend:8000
    command: ["npm", "start"]
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

  compreface-admin:
    ports: !override
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  compreface-api:
    ports: !reset []
    environment:
      API_JAVA_OPTS: "-Xmx2g"
    restart: unless-stopped

  compreface-core:
    # Reserve up to 8 vCPUs for face inference. Without an explicit
    # ceiling the kernel can starve compreface-core during a scan rush
    # while 12 other containers fight for cycles; explicit allocation
    # keeps 1:N search latency predictable under concurrent load.
    cpus: 8.0
    restart: unless-stopped

  compreface-postgres-db:
    restart: unless-stopped

  # Re-ID sidecar (Phase 0 — see reid-api/README.md). Built from this repo;
  # OSNet ONNX model lives in reid-api/models/ mounted read-only. Fail-soft:
  # if the model is missing the container starts but /embed returns 503 and
  # the indexer writes NULL embeddings until the model is in place.
  reid-api:
    restart: unless-stopped

  # Caddy is disabled in VPS mode — the host's nginx terminates TLS instead.
  caddy:
    deploy:
      replicas: 0

  # CompreFace UI bundle (missing from base compose). FE = React app, ui-nginx
  # routes /api/* -> api backend, /admin/* -> admin backend, /* -> fe.
  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: compreface-fe
    environment:
      CLIENT_MAX_BODY_SIZE: 50M
      PROXY_READ_TIMEOUT: 60s
      PROXY_CONNECT_TIMEOUT: 60s
      MAX_FILE_SIZE: 5242880
    depends_on:
      - compreface-admin
      - compreface-api
    restart: unless-stopped

  compreface-ui-nginx:
    image: nginx:1.25-alpine
    container_name: compreface-ui-nginx
    depends_on:
      - compreface-fe
      - compreface-admin
      - compreface-api
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./compreface-ui-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
