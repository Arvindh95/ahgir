services:
  postgres:
    ports: !reset []  # do not publish; access only via internal docker network
    restart: unless-stopped

  minio:
    ports: !reset []  # do not publish; access only via Caddy /storage proxy
    restart: unless-stopped

  redis:
    ports: !reset []  # do not publish
    restart: unless-stopped

  backend:
    volumes: !reset []
    # Caddy mode: backend port is NOT externally published (ports: !reset
    # below). The only path to backend:8000 is the Caddy container in the
    # same docker network, which connects with its OWN container IP — not
    # the bridge gateway 172.18.0.1. A narrow allow-list of
    # "172.18.0.1,127.0.0.1" would make uvicorn ignore X-Forwarded-For from
    # Caddy, collapsing every IP-keyed rate limit + audit row to "caddy's
    # docker IP". Since the backend port is unreachable from outside the
    # docker network, `*` is safe: only Caddy can deliver the headers, and
    # Caddy unconditionally overwrites X-Forwarded-For with the real client.
    # The vps overlay still uses the narrow list because there the ingress
    # is HOST nginx and the docker bridge gateway IS the proxy IP.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=*
    ports: !reset []  # do not publish; Caddy proxies /api → backend:8000
    environment:
      # Pin ENVIRONMENT here so a missing/typo'd .env can't silently leave the
      # service on the development default (which disables
      # validate_production_secrets and lets dev placeholders through).
      ENVIRONMENT: production
      COMPREFACE_API_URL: "http://compreface-api:8080,http://compreface-api-2:8080"
    depends_on:
      compreface-api-2:
        condition: service_started
    restart: unless-stopped

  worker:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
      COMPREFACE_API_URL: "http://compreface-api:8080,http://compreface-api-2:8080"
      PYTHONPATH: /app
    depends_on:
      compreface-api-2:
        condition: service_started
    # Run preflight first — API validates at FastAPI import, but the worker
    # doesn't import app.main, so without this gate a bad MinIO/DB/CompreFace
    # env would leave RQ running with broken settings. PYTHONPATH=/app so
    # `python scripts/preflight.py` can import the app package (without it
    # python only adds /app/scripts to sys.path).
    command: >
      /bin/sh -c "python scripts/preflight.py &&
      rq worker --url redis://redis:6379/0 face_indexing retention default"
    restart: unless-stopped

  # Same hardening as backend/worker/frontend: drop the dev source bind mount
  # (else cron runs mutable host code while the rest of the stack runs built
  # images) and pin ENVIRONMENT so the cron loop logs prod-correct context.
  retention-scheduler:
    volumes: !reset []
    environment:
      ENVIRONMENT: production
    # Preflight before each retention pass; same reason as worker above.
    command: >
      /bin/sh -c "sleep 60;
      while true; do
        if PYTHONPATH=/app python scripts/preflight.py && PYTHONPATH=/app python scripts/run_retention.py; then
          sleep 86400;
        else
          echo 'retention preflight or enqueue failed (exit non-zero); retrying in 1h';
          sleep 3600;
        fi;
      done"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
        NEXT_PUBLIC_API_URL: /api
    environment:
      # SSR (getServerSideProps) runs inside this container as a Node process.
      # NEXT_PUBLIC_API_URL=/api is a relative path that browsers can resolve
      # against window.location but Node cannot — fetch('/api/...') from
      # SSR throws "TypeError: Invalid URL". Point server-side fetches at the
      # backend over the Docker network so /share/{event}/{image} SSR works
      # in prod the same way it does in dev.
      SERVER_API_URL: http://backend:8000
    volumes: !reset []
    ports: !reset []  # do not publish; Caddy proxies /* → frontend:3000
    command: ["npm", "start"]
    restart: unless-stopped

  # Wire the prod Caddyfile (security headers, /storage removed, log to file).
  # Base compose mounts the dev Caddyfile; without this override a prod-only
  # header / log change made in Caddyfile.prod would silently not apply.
  caddy:
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # CompreFace admin disabled in prod (saves ~660MB RAM); also no port pub
  compreface-admin:
    ports: !reset []
    deploy:
      replicas: 0

  # Tune CompreFace API memory (8g -> 2g) and unpublish port (internal-only in prod)
  compreface-api:
    ports: !reset []
    environment:
      API_JAVA_OPTS: "-Xmx2g"
    restart: unless-stopped

  compreface-core:
    restart: unless-stopped

  compreface-postgres-db:
    restart: unless-stopped

  # Second CompreFace instance for load balancing
  compreface-api-2:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: "-Xmx2g"
      SAVE_IMAGES_TO_DB: "true"
      MAX_FILE_SIZE: "50MB"
      MAX_REQUEST_SIZE: "50MB"
      CONNECTION_TIMEOUT: "10000"
      READ_TIMEOUT: "60000"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core-2:
        condition: service_started
    restart: unless-stopped

  compreface-core-2:
    image: exadel/compreface-core:1.2.0
    container_name: compreface-core-2
    environment:
      ML_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
