version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: picur-postgres
    environment:
      POSTGRES_USER: picur
      POSTGRES_PASSWORD: picur
      POSTGRES_DB: picur
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picur"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: picur-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: picur-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picur-backend
    environment:
      DATABASE_URL: postgresql://picur:picur@postgres:5432/picur
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: ahgir.com/storage
      MINIO_EXTERNAL_SECURE: "true"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: "00000000-0000-0000-0000-000000000002"
      COMPREFACE_DETECTION_API_KEY: "00000000-0000-0000-0000-000000000003"
      FRONTEND_URL: https://ahgir.com
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picur-worker
    environment:
      DATABASE_URL: postgresql://picur:picur@postgres:5432/picur
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: "00000000-0000-0000-0000-000000000002"
      COMPREFACE_DETECTION_API_KEY: "00000000-0000-0000-0000-000000000003"
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      FRONTEND_URL: https://ahgir.com
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: rq worker --url redis://redis:6379/0 face_indexing retention default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: picur-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SERVER_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: picur-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # CompreFace services for face recognition
  compreface-postgres-db:
    image: postgres:11.5
    container_name: compreface-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frs
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frs"]
      interval: 10s
      timeout: 5s
      retries: 5

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: compreface-admin
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"
      EMAIL_HOST: smtp.example.com
      EMAIL_USERNAME: user@example.com
      EMAIL_PASSWORD: password
      ADMIN_PORTAL_URL: http://localhost:8082
      REGISTRATION_DISABLED: "false"
    ports:
      - "8082:8080"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: "-Xmx8g"
      SAVE_IMAGES_TO_DB: "true"
      MAX_FILE_SIZE: "50MB"
      MAX_REQUEST_SIZE: "50MB"
    ports:
      - "8083:8080"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_started

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: compreface-core
    environment:
      ML_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
  compreface_postgres_data:
