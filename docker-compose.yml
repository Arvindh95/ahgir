services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: picur-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picur_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-picur}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picur}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pinned to a specific MinIO release + content digest for reproducible
    # rollback. `:latest` was previously here, which silently changed
    # behavior between deploys. Bump deliberately when upgrading.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: picur-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: picur-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picur-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      MINIO_EXTERNAL_SECURE: ${MINIO_EXTERNAL_SECURE:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      COMPREFACE_DETECTION_API_KEY: ${COMPREFACE_DETECTION_API_KEY:-}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.80}
      FACE_SIMILARITY_THRESHOLD_MEDIUM: ${FACE_SIMILARITY_THRESHOLD_MEDIUM:-0.85}
      FACE_SIMILARITY_THRESHOLD_SMALL: ${FACE_SIMILARITY_THRESHOLD_SMALL:-0.90}
      FACE_SIZE_MEDIUM_PX: ${FACE_SIZE_MEDIUM_PX:-60}
      FACE_SIZE_LARGE_PX: ${FACE_SIZE_LARGE_PX:-150}
      FACE_MIN_DETECTION_PROBABILITY: ${FACE_MIN_DETECTION_PROBABILITY:-0.3}
      FACE_MIN_CROP_PIXELS: ${FACE_MIN_CROP_PIXELS:-32}
      FACE_CROP_PADDING_FACTOR: ${FACE_CROP_PADDING_FACTOR:-0.4}
      FACE_GENDER_FILTER_ENABLED: ${FACE_GENDER_FILTER_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-for-prod}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'

  # Daily retention cron: enqueues an RQ job that the regular worker drains.
  # Uses tianon/true-style sleep loop so we don't depend on a separate cron sidecar image.
  retention-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picur-retention-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app
    # First run delayed 60s so the worker is up. On success we sleep 24h
    # before the next attempt. On failure (Redis briefly unreachable, DB
    # blip, etc.) we retry in 1h instead of letting the failure silently
    # mask retention + subscription downgrade + stale-pending recovery
    # for an entire day. The compose loop's previous pattern of
    # `python ... || echo` swallowed the exit code and always waited 24h.
    command: >
      /bin/sh -c "sleep 60;
      while true; do
        if PYTHONPATH=/app python scripts/run_retention.py; then
          sleep 86400;
        else
          echo 'retention enqueue failed (exit non-zero); retrying in 1h';
          sleep 3600;
        fi;
      done"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picur-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picur}:${POSTGRES_PASSWORD:-picur_dev_only}@postgres:5432/${POSTGRES_DB:-picur}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      REDIS_URL: redis://redis:6379/0
      COMPREFACE_API_URL: http://compreface-api:8080
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-}
      COMPREFACE_DETECTION_API_KEY: ${COMPREFACE_DETECTION_API_KEY:-}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.80}
      FACE_SIMILARITY_THRESHOLD_MEDIUM: ${FACE_SIMILARITY_THRESHOLD_MEDIUM:-0.85}
      FACE_SIMILARITY_THRESHOLD_SMALL: ${FACE_SIMILARITY_THRESHOLD_SMALL:-0.90}
      FACE_SIZE_MEDIUM_PX: ${FACE_SIZE_MEDIUM_PX:-60}
      FACE_SIZE_LARGE_PX: ${FACE_SIZE_LARGE_PX:-150}
      FACE_MIN_DETECTION_PROBABILITY: ${FACE_MIN_DETECTION_PROBABILITY:-0.3}
      FACE_MIN_CROP_PIXELS: ${FACE_MIN_CROP_PIXELS:-32}
      FACE_CROP_PADDING_FACTOR: ${FACE_CROP_PADDING_FACTOR:-0.4}
      FACE_GENDER_FILTER_ENABLED: ${FACE_GENDER_FILTER_ENABLED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-not-for-prod}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compreface-api:
        condition: service_started
    security_opt:
      - seccomp:unconfined
    command: rq worker --url redis://redis:6379/0 face_indexing retention default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: picur-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SERVER_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: picur-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # CompreFace services for face recognition
  compreface-postgres-db:
    image: postgres:11.5
    container_name: compreface-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      POSTGRES_DB: frs
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frs"]
      interval: 10s
      timeout: 5s
      retries: 5

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: compreface-admin
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"
      EMAIL_HOST: smtp.example.com
      EMAIL_USERNAME: user@example.com
      EMAIL_PASSWORD: password
      ADMIN_PORTAL_URL: http://localhost:8082
      REGISTRATION_DISABLED: "false"
    ports:
      - "8082:8080"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMPREFACE_DB_PASSWORD:-postgres}
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: "-Xmx8g"
      SAVE_IMAGES_TO_DB: "true"
      MAX_FILE_SIZE: "50MB"
      MAX_REQUEST_SIZE: "50MB"
    ports:
      - "8083:8080"
    depends_on:
      compreface-postgres-db:
        condition: service_healthy
      compreface-core:
        condition: service_started

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: compreface-core
    environment:
      ML_PORT: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
  compreface_postgres_data:
