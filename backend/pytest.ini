[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --hypothesis-profile=ci
markers =
    property_test: Property-based tests using Hypothesis
    integration: Integration tests requiring full environment
    unit: Unit tests
    requires_external_services: Tests that exercise a real MinIO or
        CompreFace endpoint and don't mock it. Skipped in CI (GH
        Actions only spins up Postgres + Redis service containers);
        run locally against a docker-compose stack. CI invokes
        `pytest -m "not requires_external_services"`.
asyncio_mode = auto

[hypothesis]
max_examples = 20
deadline = 5000
