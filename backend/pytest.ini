[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --hypothesis-profile=ci
markers =
    property_test: Property-based tests using Hypothesis
    integration: Integration tests requiring full environment
    unit: Unit tests
asyncio_mode = auto

[hypothesis]
max_examples = 20
deadline = 5000
